<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Karaoke</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: -apple-system, sans-serif; }
    #idle-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      width: 100vw; height: 100vh;
      color: #fff;
    }
    #idle-screen h1 { font-size: 64px; font-weight: 300; margin-bottom: 16px; }
    #idle-screen p { font-size: 24px; color: rgba(255,255,255,0.5); }
    #player-frame {
      display: none;
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      border: none;
    }
  </style>
</head>
<body>
  <div id="idle-screen">
    <h1>Voice Karaoke</h1>
    <p>Waiting for a song...</p>
  </div>
  <iframe id="player-frame" allow="autoplay; encrypted-media" allowfullscreen></iframe>

  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <script>
    const CHANNEL = 'urn:x-cast:com.voice.karaoke';
    const context = cast.framework.CastReceiverContext.getInstance();
    const frame = document.getElementById('player-frame');
    const idle = document.getElementById('idle-screen');

    let currentVideoId = null;
    let pollInterval = null;

    function loadVideo(videoId) {
      currentVideoId = videoId;
      idle.style.display = 'none';
      frame.style.display = 'block';
      // Load the full YouTube mobile watch page — may inherit device Google account
      frame.src = 'https://m.youtube.com/watch?v=' + videoId;
      console.log('[Receiver] Loading watch page:', videoId);

      // Start polling once the iframe loads
      frame.onload = function() {
        console.log('[Receiver] Watch page loaded');
        startPolling();
        // Inject keep-alive and auto-play JS after a delay
        setTimeout(injectKeepAlive, 3000);
      };
    }

    function injectKeepAlive() {
      try {
        var doc = frame.contentDocument || frame.contentWindow.document;
        var script = doc.createElement('script');
        script.textContent = `
          if (!window._castKeepAlive) {
            window._castKeepAlive = true;
            setInterval(function() {
              var v = document.querySelector('video');
              if (!v) return;
              // Auto-play if paused (dismiss YouTube interruptions)
              if (v.paused && !v.ended) {
                v.play().catch(function(){});
              }
              // Click dismiss/skip buttons
              var btns = document.querySelectorAll(
                '[aria-label="No thanks"], [aria-label="Dismiss"], ' +
                '.dismiss-button, ytm-dialog-renderer button, ' +
                '.ytp-ad-skip-button, .ytp-ad-skip-button-modern, ' +
                '.ytp-ad-skip-button-slot button'
              );
              btns.forEach(function(b) { if (b.offsetParent) b.click(); });
            }, 500);
          }
        `;
        doc.body.appendChild(script);
        console.log('[Receiver] Keep-alive injected');
      } catch(e) {
        // Cross-origin — can't inject. Fall back to polling only.
        console.log('[Receiver] Cannot inject into iframe (cross-origin):', e.message);
      }
    }

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(function() {
        try {
          var doc = frame.contentDocument || frame.contentWindow.document;
          var v = doc.querySelector('video');
          if (v && v.ended) {
            console.log('[Receiver] Video ended');
            send({ event: 'ended' });
            clearInterval(pollInterval);
            pollInterval = null;
          }
        } catch(e) {
          // Cross-origin — can't poll. Use message-based approach below.
        }
      }, 1000);
    }

    function stopVideo() {
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
      frame.src = 'about:blank';
      frame.style.display = 'none';
      idle.style.display = 'flex';
      currentVideoId = null;
    }

    function send(obj) {
      context.sendCustomMessage(CHANNEL, undefined, obj);
    }

    // --- Handle messages from the iPad sender ---
    context.addCustomMessageListener(CHANNEL, function(event) {
      var data = event.data;
      console.log('[Receiver] Message:', JSON.stringify(data));

      if (data.action === 'load' && data.videoId) {
        loadVideo(data.videoId);
      } else if (data.action === 'stop') {
        stopVideo();
      }
    });

    // --- Start receiver ---
    var opts = new cast.framework.CastReceiverOptions();
    opts.disableIdleTimeout = true;
    context.start(opts);
    console.log('[Receiver] Started');
  </script>
</body>
</html>
